name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (phpunit, phpstan, cs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app_secret
      DB_NAME_TEST: app_test
      JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_32
      MESSENGER_TRANSPORT_DSN: 'in-memory://'
      # Тесты идут на голом раннере, не в Docker: дефолтный /var/www/storage
      # там не существует и не создаётся (нет прав) — пишем в workspace.
      STORAGE_PATH: ${{ github.workspace }}/backend/var/storage
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: amqp, pdo_pgsql, zip, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create test database
        run: |
          PGPASSWORD=app_secret psql -h 127.0.0.1 -U app -d app -c 'CREATE DATABASE app_test;'

      - name: Code style (dry run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: PHPUnit
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

  e2e:
    name: E2E (docker compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Start docker stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
        # GITHUB_TOKEN → build-arg → composer github-oauth: неавторизованный api.github.com
        # (dist-зипы зависимостей) троттлится на общих IP раннеров — curl 28/56 при сборке
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: frontend
        run: npx playwright test

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker build (prod target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build php image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          # авторизация composer при скачивании dist-зипов с api.github.com (см. e2e)
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: false

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
